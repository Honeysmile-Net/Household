<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คลังบ้าน">
<meta name="theme-color" content="#3db89a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>คลังของใช้ในบ้าน</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#ffffff;--bg2:#f0f9f6;--bg3:#dff0eb;--bg4:#e8f4fd;--text:#1e3a35;--text2:#5a8a7e;--text3:#9ec4bc;--border:rgba(100,180,160,.2);--border2:rgba(60,140,120,.35);--accent:#3db89a;--accent2:#5bbfe8;--accent-light:#e0f5f0;--r:10px;--rl:14px;--danger:#e05a5a;}
@media(prefers-color-scheme:dark){:root{--bg:#0f2520;--bg2:#1a3830;--bg3:#142e28;--bg4:#132335;--text:#d4f0e8;--text2:#7dbfb0;--text3:#4a8a7e;--border:rgba(100,200,160,.15);--border2:rgba(100,200,160,.3);--accent:#3db89a;--accent2:#5bbfe8;--accent-light:#1a3830;--danger:#e05a5a;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:linear-gradient(160deg,#e8f6f2 0%,#d4edf8 50%,#e0f5ee 100%);background-attachment:fixed;color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,16px)}
.top-bar{background:linear-gradient(135deg,#e8f8f3 0%,#ddf0fb 100%);border-bottom:.5px solid var(--border);padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:100;display:flex;align-items:flex-start;justify-content:space-between}
.top-bar-text h1{font-size:22px;font-weight:700;letter-spacing:-.5px}.top-bar-text p{font-size:13px;color:var(--text2);margin-top:2px}
.lang-btn{background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);flex-shrink:0;margin-top:2px}
.lang-btn:active{opacity:.7}
.tabs{display:flex;background:linear-gradient(135deg,#edfaf5 0%,#e4f3fc 100%);border-bottom:1px solid rgba(60,180,150,.2);padding:0 4px;position:sticky;top:calc(70px + env(safe-area-inset-top,0px));z-index:99}
.tab{flex:1;padding:10px 4px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:4px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.content{padding:16px 16px 32px;max-width:600px;margin:0 auto}
.section{display:none}.section.active{display:block}
.card{background:rgba(255,255,255,.85);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;border:.5px solid rgba(80,180,155,.2);backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(60,160,130,.06)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.field input,.field select{font-size:16px;padding:9px 12px;border:.5px solid rgba(61,184,154,.3);border-radius:var(--r);background:rgba(240,251,247,.8);color:var(--text);width:100%;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,184,154,.15)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--r);border:.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;-webkit-appearance:none}
.btn:active{opacity:.7}
.btn-p{background:linear-gradient(135deg,#3db89a 0%,#2da888 100%);color:#fff;border-color:transparent;width:100%;justify-content:center;box-shadow:0 2px 8px rgba(61,184,154,.3)}
.btn-sm{padding:6px 12px;font-size:13px}
.ir{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.8);border-bottom:.5px solid rgba(100,200,170,.15);transition:background .15s;}
.ir:first-child{border-radius:var(--rl) var(--rl) 0 0}
.ir:last-child{border-bottom:none;border-radius:0 0 var(--rl) var(--rl)}
.ir:only-child{border-radius:var(--rl)}
#item-grid{border:.5px solid rgba(80,190,160,.2);border-radius:var(--rl);overflow:hidden;margin-bottom:4px;box-shadow:0 2px 8px rgba(60,160,130,.06)}
.ir-low{background:rgba(255,230,230,.6)}
@media(prefers-color-scheme:dark){.ir-low{background:#2a1a1a}}
.ir-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
.ir-cat{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0;min-width:60px}
.ir-name{font-size:12px;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ir-qty{font-size:12px;font-weight:700;color:var(--text);flex-shrink:0;min-width:16px;text-align:right}
.ir-qty-low{color:#E24B4A}
.ir-unit{font-size:11px;color:var(--text2);flex-shrink:0;min-width:24px}
.ir-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:15px;flex-shrink:0}
.ir-del:hover,.ir-del:active{color:#E24B4A}
.ir-qb{display:flex;align-items:center;gap:3px;flex-shrink:0}
.ir-qbtn{width:20px;height:20px;border-radius:50%;border:.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;flex-shrink:0}
.ir-qbtn:active{opacity:.6}
.dbtn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px}
.fr{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text2);white-space:nowrap;-webkit-appearance:none}
.pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.st{background:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(224,248,255,.9) 100%);border-radius:var(--r);padding:12px;border:.5px solid rgba(91,191,232,.2);box-shadow:0 1px 6px rgba(91,191,232,.08)}
.sl{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.sn{font-size:22px;font-weight:700}
.sb{background:rgba(255,255,255,.85);border:.5px solid rgba(80,190,160,.2);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(60,160,130,.06)}
.sh{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:linear-gradient(135deg,#f0faf7 0%,#e8f5fd 100%)}
.sd{font-size:15px;font-weight:600}
.sm{font-size:12px;color:var(--text2);margin-left:auto;display:flex;gap:10px;align-items:center}
.si{max-height:0;overflow:hidden;transition:max-height .25s ease}
.si.open{max-height:800px}
.lr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:.5px solid var(--border)}
.li{font-size:20px;flex-shrink:0}.ln{font-size:14px;font-weight:500;flex:1}.lsub{font-size:12px;color:var(--text2)}
.lq{font-size:13px;color:var(--text2);white-space:nowrap}.lp{font-size:14px;font-weight:600;white-space:nowrap}
.log-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;flex-shrink:0}
.wb{background:linear-gradient(135deg,#fff8e8 0%,#fef0d0 100%);border-radius:var(--rl);padding:12px 16px;margin-bottom:14px;border:.5px solid rgba(239,159,39,.4)}
.wt{font-size:13px;font-weight:600;color:#633806;margin-bottom:8px}
.wc{display:flex;flex-wrap:wrap;gap:6px}
.wch{background:#fff;border:.5px solid #EF9F27;border-radius:999px;padding:4px 10px;font-size:12px;color:#633806}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;padding:40px 0;color:var(--text2);font-size:15px;line-height:1.8}
.cv{font-size:14px;color:var(--text2);transition:transform .2s}.cv.open{transform:rotate(180deg)}
.stbg{font-size:11px;background:var(--bg3);padding:2px 8px;border-radius:999px;color:var(--text2)}
.xli{background:rgba(255,255,255,.85);border:.5px solid rgba(80,190,160,.2);border-radius:var(--rl);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:opacity .2s;box-shadow:0 1px 5px rgba(60,160,130,.05)}
.xli.done{opacity:.4}.xli.done .xln{text-decoration:line-through}
.xck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--bg);-webkit-appearance:none}
.xck.checked{background:linear-gradient(135deg,#3db89a,#2da888);border-color:transparent;box-shadow:0 2px 6px rgba(61,184,154,.4)}
.xln{font-size:15px;font-weight:500;flex:1}.xq{font-size:13px;color:var(--text2);white-space:nowrap}
.xdl{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:16px}
.xpb{height:5px;background:var(--bg3);border-radius:999px;margin-bottom:8px;overflow:hidden}
.xpbi{height:100%;background:linear-gradient(90deg,#3db89a,#5bbfe8);border-radius:999px;transition:width .3s ease}
.xsum{font-size:12px;color:var(--text2);margin-bottom:12px;display:flex;justify-content:space-between}

.inv-v-layout{
display:flex;
flex-direction:column;
height:calc(100vh - 140px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
}
.inv-list-panel{
flex:1;
display:flex;
flex-direction:column;
min-height:0;
margin-bottom:12px;
}
.inv-list-controls{
display:flex;
align-items:center;
gap:8px;
margin-bottom:8px;
flex-shrink:0;
}
.sort-btn{
padding:5px 12px;
border-radius:999px;
font-size:12px;
cursor:pointer;
border:.5px solid var(--border2);
background:var(--bg);
color:var(--text2);
-webkit-appearance:none;
flex-shrink:0;
}
#filter-row{flex-shrink:0}
.inv-list-scroll{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
min-height:0;
}





.filter-dropdown{position:relative;flex:1;min-width:0}
.filter-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;cursor:pointer;border:.5px solid rgba(61,184,154,.4);background:rgba(255,255,255,.8);color:var(--text2);-webkit-appearance:none;width:100%;min-width:0;text-align:left;backdrop-filter:blur(4px)}
.filter-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:rgba(255,255,255,.96);border:.5px solid rgba(61,184,154,.25);border-radius:var(--r);z-index:200;max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 4px 20px rgba(61,184,154,.15);backdrop-filter:blur(12px)}
.filter-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-size:14px;color:var(--text);border-bottom:.5px solid var(--border)}
.filter-opt:last-child{border-bottom:none}
.filter-opt input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--text)}

.inv-form-panel{flex-shrink:0;background:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(235,248,255,.9) 100%);border:.5px solid rgba(91,191,232,.25);border-radius:var(--rl);padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(91,191,232,.08)}
.form-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.form-title{font-size:13px;font-weight:600;color:var(--text)}
.form-subtitle{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4}
.btn-clear-form{background:none;border:.5px solid var(--border2);border-radius:var(--r);padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-clear-form:active{opacity:.7}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{padding:3px 8px;border-radius:999px;font-size:11px;border:.5px solid rgba(61,184,154,.35);background:rgba(224,248,240,.6);color:var(--text2);cursor:pointer;-webkit-appearance:none}
.chip-active{background:linear-gradient(135deg,#3db89a,#2da888);color:#fff;border-color:transparent;box-shadow:0 1px 5px rgba(61,184,154,.35)}
.chip:active{opacity:.7}
.inv-form-panel .field{margin-bottom:7px}
.inv-form-panel .field label{font-size:11px}
.inv-form-panel .field input,.inv-form-panel .field select{font-size:14px;padding:7px 9px}

.icon-opt{font-size:22px;padding:5px 7px;border:1.5px solid rgba(61,184,154,.2);border-radius:8px;background:rgba(255,255,255,.7);cursor:pointer;line-height:1;-webkit-appearance:none;transition:all .1s;flex-shrink:0}
.icon-opt:active{transform:scale(.9)}
.cat-tab-btn{transition:color .15s,border-bottom-color .15s}

#form-body{overflow:hidden;transition:none}
.inv-form-panel .form-header:hover{opacity:.95}
</style>

</head>
<body>
<div class="top-bar">
  <div class="top-bar-text">
    <h1 id="app-title">&#127968; คลังของใช้ในบ้าน</h1>
    <p id="app-sub">จัดการสินค้าและบันทึกการซื้อทุกครั้ง</p>
  </div>
  <button class="lang-btn" onclick="toggleLang()" id="lang-btn">EN</button>
</div>
<div class="tabs">
  <button class="tab active" id="t-inventory" onclick="switchTab('inventory')">&#128230; <span data-i="tab_inventory"></span></button>
  <button class="tab" id="t-buy" onclick="switchTab('buy')">&#128722; <span data-i="tab_buy"></span></button>
  <button class="tab" id="t-history" onclick="switchTab('history')">&#128197; <span data-i="tab_history"></span></button>
  <button class="tab" id="t-shoplist" onclick="switchTab('shoplist')">&#9989; <span data-i="tab_shoplist"></span></button>
</div>
<div class="content">
  <div id="tab-inventory" class="section active">
  <div class="inv-v-layout">
    <!-- TOP: Inventory List -->
    <div class="inv-list-panel">
      <div class="inv-list-controls">
        <button id="sort-btn" onclick="toggleSort()" class="sort-btn">
          &#8645; 
          <span id="sort-btn-label"></span>
        </button>
        <div class="filter-dropdown" style="flex:1;min-width:0">
          <button id="filter-dropdown-btn" onclick="toggleFilterDropdown()" class="filter-btn">
            &#9660; 
            <span id="filter-summary" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span>
            <span id="filter-chev" style="font-size:11px">&#9660;</span>
          </button>
          <div id="filter-dropdown-menu" class="filter-menu" style="display:none"></div>
        </div>
      </div>
      <div class="inv-list-scroll">
        <div id="item-grid"></div>
      </div>
    </div>
    <!-- BOTTOM: Add Item Form -->
    <div class="inv-form-panel">
      <div class="form-header">
        <div style="flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent" onclick="toggleForm()">
          <div class="form-title"><span data-i="add_form_title"></span></div>
          <div class="form-subtitle" data-i="add_form_subtitle"></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button type="button" class="btn-clear-form" onclick="clearForm()" data-i="btn_clear_form" id="form-clear-btn"></button>
          <button type="button" onclick="toggleForm()" style="background:none;border:none;cursor:pointer;padding:6px;color:var(--text2);-webkit-tap-highlight-color:transparent;min-width:32px;min-height:32px">
            <span id="form-toggle-icon" style="font-size:13px;display:inline-block;line-height:1">&#9650;</span>
          </button>
        </div>
      </div>
      <div id="form-body">
      <div class="field"><label data-i="lbl_name"></label><input type="text" id="new-name" data-i-ph="ph_name"></div>
      <div class="form-row-2">
        <div class="field"><label data-i="lbl_cat"></label>
          <select id="new-cat" onchange="onCatChange(this)"></select>
        </div>
        <div class="field">
          <label data-i="lbl_unit"></label>
          <input type="text" id="new-unit" data-i-ph="ph_unit" oninput="renderUnitChips()">
          <div id="unit-chips" class="unit-chips"></div>
        </div>
      </div>
      <div class="form-row-2">
        <div class="field"><label data-i="lbl_qty_init"></label><input type="number" id="new-qty" placeholder="0" min="0" inputmode="numeric"></div>
        <div class="field"><label data-i="lbl_alert"></label><input type="number" id="new-min" placeholder="1" min="0" inputmode="numeric"></div>
      </div>
      <button type="button" class="btn btn-p" onclick="addItem()" style="width:100%;justify-content:center;margin-top:2px">+ <span data-i="btn_add_stock"></span></button>
      </div>
    </div>
  </div>
</div>

  <div id="tab-buy" class="section">
    <div class="sr">
      <div class="st"><div class="sl" data-i="stat_total"></div><div class="sn" id="stat-items">0</div></div>
      <div class="st"><div class="sl" data-i="stat_month"></div><div class="sn" id="stat-month">&#3647;0</div></div>
      <div class="st"><div class="sl" data-i="stat_low"></div><div class="sn" id="stat-low">0</div></div>
    </div>
    <div class="card">
      <div class="field"><label data-i="lbl_item"></label><select id="buy-item-sel"></select></div>
      <div class="r2">
        <div class="field"><label data-i="lbl_qty_buy"></label><input type="number" id="buy-qty" value="1" min="1" inputmode="numeric"></div>
        <div class="field"><label data-i="lbl_price"></label><input type="number" id="buy-price" placeholder="0" min="0" inputmode="decimal"></div>
      </div>
      <div class="r2">
        <div class="field"><label data-i="lbl_date"></label><input type="date" id="buy-date"></div>
        <div class="field"><label data-i="lbl_store"></label><input type="text" id="buy-store" data-i-ph="ph_store"></div>
      </div>
      <div class="field"><label data-i="lbl_note"></label><input type="text" id="buy-note" data-i-ph="ph_note"></div>
      <button class="btn btn-p" id="buy-btn" onclick="recordBuy()">&#128722; <span data-i="btn_record"></span></button>
    </div>
  </div>
  <div id="tab-history" class="section"><div id="history-view"></div></div>
  <div id="tab-shoplist" class="section">
  <div class="card">
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div class="field" style="flex:1;margin-bottom:0"><label data-i="lbl_add_item"></label><select id="sl-item-sel"></select></div>
      <div class="field" style="width:72px;margin-bottom:0"><label data-i="lbl_qty_buy"></label><input type="number" id="sl-qty" value="1" min="1" inputmode="numeric"></div>
      <button type="button" class="btn" style="height:42px;padding:0 14px;flex-shrink:0;align-self:flex-end" onclick="addToShopList()">+</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button type="button" class="btn btn-sm" onclick="addLowStock()">&#9888;  <span data-i="btn_add_low"></span></button>
      <button type="button" class="btn btn-sm btn-p" id="share-btn" onclick="shareShoplist()" style="margin-left:auto">&#128279; <span data-i="btn_share"></span></button>
      <button type="button" class="btn btn-sm" onclick="clearDone()" style="color:#A32D2D;border-color:#E24B4A">&#128465;  <span data-i="btn_clear_done"></span></button>
    </div>
  </div>
  <div id="shoplist-view"></div>
</div>

<script>
var IK='hh4_items',LK='hh4_logs',SK='hh4_shoplist',LANGK='hh4_lang';
var items=[],logs=[],shoplist=[],curLang='th';
try{
  items=JSON.parse(localStorage.getItem(IK)||'[]');
  logs=JSON.parse(localStorage.getItem(LK)||'[]');
  shoplist=JSON.parse(localStorage.getItem(SK)||'[]');
  curLang=localStorage.getItem(LANGK)||'th';
}catch(e){}

logs=logs.map(function(l){
  if(!l.date||typeof l.date!=='string'){
    try{var d=new Date(l.date);l.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    catch(e){l.date=new Date().toISOString().split('T')[0];}
  }
  if(!l.date||l.date==='undefined') l.date=new Date().toISOString().split('T')[0];
  return l;
});

function t(k){return (I18N[curLang]||I18N.th)[k]||k;}
function emoji(cat){
  // Check catList for custom icon
  var c=catList.find(function(x){return x.th===cat||x.en===cat;});
  if(c&&c.icon) return c.icon;
  // Fallback to DEFAULT_CAT_MAP display name then CAT_EMOJI
  var m=DEFAULT_CAT_MAP.find(function(x){return x.th===cat||x.en===cat;});
  if(m) return CAT_EMOJI[m.th]||CAT_EMOJI[m.en]||'📦';
  return CAT_EMOJI[cat]||'📦';
}

  document.getElementById('app-title').textContent=t('app_title');
  document.getElementById('app-sub').textContent=t('app_sub');
  document.getElementById('lang-btn').textContent=curLang==='th'?'EN':'TH';

}

function toggleLang(){
  curLang=curLang==='th'?'en':'th';

function itemMatchesCategoryKey(item, key){
  if(!key||key.indexOf('cat:')!==0) return false;
  var idx=parseInt(key.split(':')[1]);
  var c=catList[idx];
  if(!c) return false;
  return item.cat===c.th||item.cat===c.en;
}

function catDisplayName(cat){
  // Try hardcoded map first (handles default cats regardless of localStorage state)
  var m=DEFAULT_CAT_MAP.find(function(x){return x.th===cat||x.en===cat;});
  if(m) return curLang==='th'?m.th:m.en;
  // Then try catList (for user-added custom cats)
  var c=catList.find(function(x){return x.th===cat||x.en===cat;});
  if(c) return curLang==='th'?c.th:c.en;
  return cat;
}
function catKeyToLabel(key){
  if(!key||key.indexOf('cat:')!==0) return key;
  var idx=parseInt(key.split(':')[1]);
  var c=catList[idx];
  if(!c) return key;
  return curLang==='th'?c.th:c.en;
}
function renderFilterDropdown(){
  var isEN=curLang==='en';
  var allLabel=isEN?'All':'ทั้งหมด';
  var lowLabel=isEN?'⚠️ Low stock':'⚠️ ใกล้หมด';
  var opts=[{v:'all',l:allLabel},{v:'low',l:lowLabel}];
  catList.forEach(function(c,i){opts.push({v:'cat:'+i,l:isEN?c.en:c.th});});
  var menu=document.getElementById('filter-dropdown-menu');
  if(!menu) return;
  menu.innerHTML=opts.map(function(o){
    var chk=selectedFilters.indexOf(o.v)>=0;
    return '<label class="filter-opt"><input type="checkbox" value="'+o.v+'" '+(chk?'checked':'')+' onchange="toggleFilterOption(this.value,this.checked)"><span>'+o.l+'</span></label>';
  }).join('');
  updateFilterSummary();
}
function updateFilterSummary(){
  var isEN=curLang==='en';
  var el=document.getElementById('filter-summary');
  if(!el) return;
  if(selectedFilters.indexOf('all')>=0){
    el.textContent=isEN?'All':'ทั้งหมด';
  } else if(selectedFilters.length===1&&selectedFilters[0]==='low'){
    el.textContent=isEN?'Low stock':'ใกล้หมด';
  } else {
    var catKeys=selectedFilters.filter(function(f){return f!=='low';});
    var hasLow=selectedFilters.indexOf('low')>=0;
    if(catKeys.length===1&&!hasLow){
      el.textContent=catKeyToLabel(catKeys[0]);
    } else {
      var parts=[];
      if(hasLow) parts.push(isEN?'Low stock':'ใกล้หมด');
      catKeys.forEach(function(k){parts.push(catKeyToLabel(k));});
      if(parts.length<=2){
        el.textContent=parts.join(', ');
      } else {
        el.textContent=parts.length+(isEN?' categories selected':' หมวดที่เลือก');
      }
    }
  }
}
function toggleFilterOption(val,checked){
  if(val==='all'){
    selectedFilters=checked?['all']:[];
  } else {
    var idx=selectedFilters.indexOf('all');
    if(idx>=0) selectedFilters.splice(idx,1);
    var i=selectedFilters.indexOf(val);
    if(checked&&i<0) selectedFilters.push(val);
    if(!checked&&i>=0) selectedFilters.splice(i,1);
    if(selectedFilters.length===0) selectedFilters=['all'];
  }
  renderFilterDropdown();
  renderItems();
}

function shareShoplist(){
  if(!shoplist.length){alert(t('no_shoplist'));return;}
  var pending=shoplist.filter(function(x){return !x.done;});
  var done=shoplist.filter(function(x){return x.done;});
  var lines=[];
  var isEN=curLang==='en';
  lines.push(isEN ? '🛒 Shopping List' : '🛒 รายการซื้อของ');
  pending.forEach(function(s){lines.push('□ '+s.name+' x'+s.qty+' '+s.unit);});
  if(done.length){
    lines.push('');
    lines.push(isEN ? '✅ Done' : '✅ ซื้อแล้ว');
    done.forEach(function(s){lines.push('☑ '+s.name+' x'+s.qty+' '+s.unit);});
  }
  var text=lines.join('\n');
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else {
    navigator.clipboard.writeText(text).then(function(){
      var btn=document.getElementById('share-btn');
      var orig=btn.innerHTML;
      btn.innerHTML='✓ คัดลอก!';
      setTimeout(function(){btn.innerHTML=orig;},1500);
    }).catch(function(){alert(text);});
  }
}

function fmtDate(d){
  if(!d) return '-';
  d=String(d);
  if(curLang==='en'){
    var p=d.split('-');
    var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return parseInt(p[2])+' '+mo[parseInt(p[1])-1]+' '+p[0];
  }
  var months=['\u0e21.\u0e04.','\u0e01.\u0e1e.','\u0e21\u0e35.\u0e04.','\u0e40\u0e21.\u0e22.','\u0e1e.\u0e04.','\u0e21\u0e34.\u0e22.','\u0e01.\u0e04.','\u0e2a.\u0e04.','\u0e01.\u0e22.','\u0e15.\u0e04.','\u0e1e.\u0e22.','\u0e18.\u0e04.'];
  var p=d.split('-');
  return parseInt(p[2])+' '+months[parseInt(p[1])-1]+' '+(parseInt(p[0])+543);
}
function renderHistory(){
  var el=document.getElementById('history-view');
  if(!el) return;
  if(!logs.length){el.innerHTML='<div class="empty">'+t('no_logs')+'</div>';return;}
  var sess={};
  logs.forEach(function(l){
    var k=(l.date||'')+(l.store?'__'+l.store:'');
    if(!sess[k]) sess[k]={date:l.date,store:l.store||'',items:[],total:0};
    sess[k].items.push(l);sess[k].total+=l.price||0;
  });
  var arr=Object.values(sess).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  var lastIds=new Set(arr[0]?arr[0].items.map(function(l){return l.itemId;}):[]);
  var notLast=items.filter(function(i){return !lastIds.has(i.id);});
  var boughtIds=new Set(logs.map(function(l){return l.itemId;}));
  var never=items.filter(function(i){return !boughtIds.has(i.id);});
  var h='';
  if(notLast.length&&arr[0]){
    h+='<div class="wb"><div class="wt">&#128336; '+t('bought_last')+' ('+fmtDate(arr[0].date)+')</div><div class="wc">';
    notLast.forEach(function(i){h+='<span class="wch">'+emoji(i.cat)+' '+i.name+'</span>';});
    h+='</div></div>';
  }
  arr.forEach(function(s,idx){
    var sid='sess-'+idx,op=idx===0;
    h+='<div class="sb"><div class="sh" data-sid="'+sid+'" onclick="toggleSess(this)">';
    h+='&#128197; ';
    h+='<span class="sd">'+fmtDate(s.date)+'</span>';
    if(s.store) h+='<span class="stbg">\ud83d\udccd '+s.store+'</span>';
    h+='<div class="sm"><span>'+s.items.length+' '+t('items_count')+'</span>';
    if(s.total) h+='<span style="font-weight:600">\u0e3f'+Math.round(s.total).toLocaleString()+'</span>';
    h+='<span class="cv'+(op?' open':'')+'" id="cv-'+sid+'"></i>';
    h+='</div></div>';
    h+='<div class="si'+(op?' open':'')+'" id="'+sid+'">';
    s.items.forEach(function(l){
      h+='<div class="lr"><span class="li">'+emoji(l.cat)+'</span>';
      h+='<div><div class="ln">'+l.name+'</div>'+(l.note?'<div class="lsub">'+l.note+'</div>':'')+'</div>';
      h+='<span class="lq">+'+l.qty+' '+l.unit+'</span>';
      if(l.price) h+='<span class="lp">\u0e3f'+Math.round(l.price).toLocaleString()+'</span>';
      h+='<button class="log-del" onclick="deleteLog('+l.id+')" aria-label="delete">&#128465;</button>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  if(never.length){
    h+='<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">'+t('never_bought')+'</div><div class="ng">';
    never.forEach(function(i){h+='<div class="nc"><span style="font-size:20px">'+emoji(i.cat)+'</span><div><div style="font-size:13px;font-weight:500">'+i.name+'</div><div style="font-size:11px;color:var(--text2)">'+t('no_history')+'</div></div></div>';});
    h+='</div></div>';
  }
  el.innerHTML=h;
}

}

      <div class="field"><label data-i="lbl_unit"></label><input type="text" id="edit-unit"></div>
      <div class="field"><label data-i="lbl_alert"></label><input type="number" id="edit-min" min="0" inputmode="numeric"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button type="button" class="btn" style="flex:1" onclick="closeEdit()" id="btn-cancel-edit"><span data-i="btn_cancel"></span></button>
      <button type="button" class="btn btn-p" style="flex:2" onclick="saveEdit()" id="btn-save-edit"><span data-i="btn_save"></span></button>
    </div>
  </div>
</div>

<div id="add-cat-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;padding:16px">
  <div style="background:linear-gradient(160deg,#f0faf7,#e8f4fd);border-radius:var(--rl);width:100%;max-width:380px;border:.5px solid rgba(61,184,154,.25);box-shadow:0 8px 32px rgba(61,184,154,.15);overflow:hidden">
    <div style="padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:17px;font-weight:700;color:var(--text)" data-i="add_cat_title"></div>
      <button type="button" onclick="closeAddCat()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);padding:4px">&#10005;</button>
    </div>
    <div style="display:flex;padding:0 18px;border-bottom:.5px solid rgba(61,184,154,.2);margin-top:12px">
      <button type="button" class="cat-tab-btn" data-tab="add" onclick="showCatTab('add')" style="flex:1;padding:9px 4px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:2px solid var(--accent);color:var(--accent)">➕ <span data-i="tab_add_cat"></span></button>
      <button type="button" class="cat-tab-btn" data-tab="del" onclick="showCatTab('del')" style="flex:1;padding:9px 4px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2)">➖ <span data-i="tab_delete_cat"></span></button>
    </div>
    <div id="tab-add-cat" style="padding:16px 18px">
      <div class="field"><label data-i="lbl_cat_th"></label><input type="text" id="new-cat-th" data-i-ph="ph_cat_th"></div>
      <div class="field"><label data-i="lbl_cat_en"></label><input type="text" id="new-cat-en" data-i-ph="ph_cat_en"></div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:8px" data-i="lbl_cat_icon"></label>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div id="new-cat-icon-preview" style="font-size:30px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);border-radius:var(--r);border:1.5px solid rgba(61,184,154,.4);box-shadow:0 2px 8px rgba(61,184,154,.12)">📦</div>
          <input type="hidden" id="new-cat-icon-val" value="📦">
          <div style="font-size:12px;color:var(--text2);line-height:1.5">กด icon ด้านล่าง<br>เพื่อเลือกใช้งาน</div>
        </div>
        <div id="icon-picker" style="display:flex;flex-wrap:wrap;gap:5px;max-height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.6);border-radius:var(--r);padding:8px;border:.5px solid rgba(61,184,154,.2)"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn" style="flex:1" onclick="closeAddCat()"><span data-i="btn_cancel"></span></button>
        <button type="button" class="btn btn-p" style="flex:2" onclick="saveNewCat()"><span data-i="tab_add_cat"></span></button>
      </div>
    </div>
    <div id="tab-del-cat" style="display:none;padding:16px 18px">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px" data-i="add_cat_subtitle"></div>
      <div id="manage-cats-list" style="max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
      <div style="margin-top:12px">
        <button type="button" class="btn" style="width:100%" onclick="closeAddCat()"><span data-i="btn_cancel"></span></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
